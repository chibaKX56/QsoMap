<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QSOマッチングマップ</title>
<script src="leaflet.js"></script>
<style>
body{font-family:sans-serif;color:#333;max-width:960px;margin:0 auto;padding:10px}
.date-header{background:#0f172a;color:#fff;padding:10px 15px;border-radius:8px;margin-bottom:12px;font-size:16px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px;margin-bottom:15px}
.card{background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:15px}
.card h3{margin:0 0 10px;font-size:16px;border-bottom:2px solid #0284c7;padding-bottom:5px}
.fg{margin-bottom:10px}.fg label{display:block;font-size:12px;font-weight:bold;margin-bottom:3px}
.fg input{width:100%;padding:8px;box-sizing:border-box;border:1px solid #94a3b8;border-radius:4px}
.btn{width:100%;padding:10px;border:none;border-radius:4px;font-weight:bold;color:#fff;cursor:pointer}
.btn-blue{background:#0284c7}.btn-green{background:#16a34a}.btn-gray{width:auto;padding:5px 10px;background:#475569;font-size:12px}
#map{height:480px;width:100%;border-radius:8px;border:1px solid #94a3b8;margin-bottom:15px;background:#bae6fd;position:relative;overflow:hidden}
.bar{background:#e0f2fe;padding:10px;border-radius:6px;margin-bottom:15px;font-weight:bold;color:#0369a1;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.err{background:#fee2e2;color:#b91c1c;padding:10px;border-radius:6px;margin-bottom:15px;display:none;font-size:13px}
h3.sec{margin:20px 0 8px;font-size:16px;color:#0f172a}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:20px}
th,td{border:1px solid #cbd5e1;padding:8px;text-align:left}th{background:#f1f5f9}
.wb{background:#fef3c7;color:#b45309;border:1px solid #f59e0b;padding:2px 6px;border-radius:4px;font-size:12px;font-weight:bold}
.c-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
.rank-lbl{background:#1e293b!important;color:#fde047!important;border:1px solid #fde047!important;font-size:11px!important;padding:1px 5px!important}
.leaflet-pane,.leaflet-tile,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-left{left:0}.leaflet-bottom{bottom:0}.leaflet-right{right:0}
.leaflet-control{pointer-events:auto;background:#fff;border:1px solid #ccc;margin:8px}
.leaflet-control-zoom a{display:block;width:26px;height:26px;line-height:26px;text-align:center;text-decoration:none;color:#000;font-weight:bold}
.leaflet-tooltip{position:absolute;padding:2px 6px;background:#fff;border:1px solid #64748b;border-radius:4px;white-space:nowrap;font-size:12px;font-weight:bold;color:#1e293b;pointer-events:none}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:15px}
.leaflet-popup-content-wrapper{padding:8px 12px;background:#fff;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
</style>
</head>
<body>
<div class="date-header"><span>📡 QSOマッチングマップ</span><span id="today-disp"></span></div>
<div id="err" class="err"></div>
<div class="grid">
  <div class="card">
    <h3>① 自局の運用場所を登録</h3>
    <div class="fg"><label>自局コールサイン *</label><input id="rc" placeholder="例: チバKX56"></div>
    <div class="fg"><label>運用場所名 *</label><input id="rp" placeholder="例: 月山山頂"></div>
    <div class="fg"><label>座標 (緯度, 経度) *</label><input id="rx" placeholder="例: 38.5497, 140.0269"></div>
    <button class="btn btn-blue" onclick="reg()">運用場所を登録・更新</button>
  </div>
  <div class="card">
    <h3>② 交信相手の入力</h3>
    <div class="fg"><label>相手局コールサイン *</label><input id="lt" placeholder="例: サイタマKM117"></div>
    <div class="fg"><label>交信時間 *</label><input type="datetime-local" id="tm"></div>
    <p style="font-size:12px;color:#64748b;margin:0 0 10px">※①の自局コールサインで送信されます</p>
    <button class="btn btn-green" onclick="qso()">交信ログを送信</button>
  </div>
</div>
<div class="bar">
  <div>状態:<span id="st">起動中</span>｜登録:<span id="c1">0</span>局｜成立:<span id="c2">0</span>本｜入力待ち:<span id="c3">0</span>件</div>
  <button class="btn btn-gray" onclick="load()">更新</button>
</div>
<div id="map"></div>
<h3 class="sec">🏆 数珠繋ぎ（リレー）合計距離ランキング</h3>
<table><thead><tr><th>順位</th><th>ライン色</th><th>合計距離</th><th>リレールート（経由局）</th></tr></thead><tbody id="tb-rank"></tbody></table>
<h3 class="sec">✅ 成立した交信一覧（区間別）</h3>
<table><thead><tr><th>局A</th><th>局B</th><th>区間距離</th><th>交信時刻</th></tr></thead><tbody id="tb1"></tbody></table>
<h3 class="sec">⏳ 相手局の入力待ち一覧（片道ログ）</h3>
<table><thead><tr><th>送信局</th><th>相手局（入力待ち）</th><th>報告時刻</th><th>状態</th></tr></thead><tbody id="tb2"></tbody></table>
<script src="app.js"></script>
</body>
</html>
