<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム無線交信（QSO）マッチングマップ</title>
  <link rel="stylesheet" href="leaflet.css" />
  <script src="leaflet.js"></script>
  <style>
    .qso-app {
      max-width: 960px;
      margin: 0 auto;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      color: #333;
    }
    .panel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    .card {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 15px;
    }
    .card h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #0f172a;
      border-bottom: 2px solid #0284c7;
      padding-bottom: 6px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #475569;
    }
    .form-group input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      font-size: 14px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
    }
    .btn-station { background: #0284c7; }
    .btn-station:hover { background: #0369a1; }
    .btn-qso { background: #16a34a; }
    .btn-qso:hover { background: #15803d; }
    .btn-reload {
      width: auto;
      padding: 5px 12px;
      background: #475569;
      font-size: 12px;
      margin-left: 10px;
    }
    #map {
      height: 500px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #94a3b8;
      margin-bottom: 20px;
    }
    .status-bar {
      background: #e0f2fe;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #0369a1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .error-box {
      background: #fee2e2;
      color: #b91c1c;
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }
    table.match-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    table.match-table th, table.match-table td {
      border: 1px solid #cbd5e1;
      padding: 8px 10px;
      text-align: left;
    }
    table.match-table th {
      background: #f1f5f9;
    }
  </style>
</head>
<body>

<div class="qso-app">
  <div id="error-box" class="error-box"></div>

  <div class="panel-grid">
    <!-- 1. 自局の運用場所登録 -->
    <div class="card">
      <h3>① 自局の運用場所を登録（事前登録）</h3>
      <div class="form-group">
        <label>自局コールサイン *</label>
        <input type="text" id="reg-call" placeholder="例: JQ1XYZ/1">
      </div>
      <div class="form-group">
        <label>運用場所名 *</label>
        <input type="text" id="reg-place" placeholder="例: 富士山山頂">
      </div>
      <div class="form-group">
        <label>運用場所の座標 (緯度, 経度) *</label>
        <input type="text" id="reg-coord" placeholder="例: 35.3606, 138.7274">
      </div>
      <button type="button" id="btn-reg" class="btn btn-station">自局の運用場所を登録・更新</button>
    </div>

    <!-- 2. 交信相手の報告 -->
    <div class="card">
      <h3>② 交信相手の入力（相互一致でライン描画）</h3>
      <div class="form-group">
        <label>相手局コールサイン *</label>
        <input type="text" id="log-target-call" placeholder="例: JJ1AAA/1">
      </div>
      <div class="form-group">
        <label>交信時間 *</label>
        <input type="datetime-local" id="log-time">
      </div>
      <p style="font-size: 12px; color: #64748b; margin: 0 0 10px 0;">
        ※①で入力した自局コールサインとして送信されます。
      </p>
      <button type="button" id="btn-qso" class="btn btn-qso">交信ログを送信する</button>
    </div>
  </div>

  <div class="status-bar" id="status-bar">
    <div>
      システム状態: <span id="sys-status">起動中...</span> ｜ 登録局数: <span id="stat-stations">0</span>局 ｜ 成立ライン数: <span id="stat-matches">0</span>本
    </div>
    <button type="button" id="btn-refresh" class="btn btn-reload">最新データに更新</button>
  </div>

  <div id="map"></div>

  <h3>成立した交信一覧（双方入力済み）</h3>
  <table class="match-table">
    <thead>
      <tr>
        <th>局A（コール / 運用地）</th>
        <th>局B（コール / 運用地）</th>
        <th>交信距離</th>
        <th>交信時間（A報告 / B報告）</th>
      </tr>
    </thead>
    <tbody id="match-tbody">
      <tr><td colspan="4" style="text-align:center; color:#64748b;">双方の入力と運用場所登録が揃うとここに表示されます</td></tr>
    </tbody>
  </table>
</div>

<!-- ========================================================= -->
<!-- ★FirebaseのURL設定（"" の中身だけを書き換えてください）      -->
<!-- ========================================================= -->
<script>
  const DATABASE_URL = "https://communication-map-b30e3-default-rtdb.firebaseio.com";
</script>
<!-- ========================================================= -->

<script>
  function showError(msg) {
    const box = document.getElementById('error-box');
    box.style.display = 'block';
    box.innerHTML = '<b>⚠️ お知らせ:</b><br>' + msg;
    document.getElementById('sys-status').textContent = 'エラー停止';
  }

  // 地図初期化
  const map = L.map('map').setView([36.2048, 138.2529], 6);
  L.tileLayer('https://gsi.go.jp{z}/{x}/{y}.png', {
    attribution: "<a href='https://gsi.go.jp' target='_blank'>地理院タイル</a>"
  }).addTo(map);
  const layerGroup = L.layerGroup().addTo(map);

  // 初期値セット
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('log-time').value = now.toISOString().slice(0, 16);

  const savedCall = localStorage.getItem('my_qso_callsign');
  if (savedCall) {
    document.getElementById('reg-call').value = savedCall;
  }

  // URL末尾のスラッシュを整理
  const cleanDbUrl = DATABASE_URL.trim().replace(/\/$/, "");

  function encodeCall(call) {
    return call.trim().toUpperCase().replace(/\//g, '_');
  }

  // データ取得・描画関数（REST API通信）
  async function loadAllData() {
    if (cleanDbUrl.includes("★ここに") || !cleanDbUrl.startsWith("https://")) {
      showError("コード内の <b>DATABASE_URL</b> に、Firebaseの「https://〇〇.firebaseio.com」または「https://〇〇.firebasedatabase.app」のURLを貼り付けてください。");
      return;
    }

    try {
      const [stRes, logRes] = await Promise.all([
        fetch(cleanDbUrl + '/stations.json'),
        fetch(cleanDbUrl + '/qso_logs.json')
      ]);

      if (!stRes.ok || !logRes.ok) {
        throw new Error("アクセス拒否（ステータス: " + stRes.status + "）。Firebaseの「Realtime Database > ルール」で .read と .write が true になっているか確認してください。");
      }

      const stationsData = (await stRes.json()) || {};
      const logsData = (await logRes.json()) || {};

      document.getElementById('sys-status').textContent = 'オンライン接続完了';
      document.getElementById('error-box').style.display = 'none';
      renderAll(stationsData, logsData);
    } catch (err) {
      showError("データベース通信エラー: " + err.message);
    }
  }

  // ① 自局登録ボタン
  document.getElementById('btn-reg').addEventListener('click', async function() {
    const rawCall = document.getElementById('reg-call').value.trim().toUpperCase();
    const place = document.getElementById('reg-place').value.trim();
    const coordStr = document.getElementById('reg-coord').value.trim();

    if (!rawCall || !place || !coordStr) {
      alert('コールサイン、運用場所、座標をすべて入力してください。');
      return;
    }

    const parts = coordStr.split(',');
    const lat = parts.length >= 1 ? parseFloat(parts.shift().trim()) : NaN;
    const lon = parts.length >= 1 ? parseFloat(parts.shift().trim()) : NaN;

    if (isNaN(lat) || isNaN(lon)) {
      alert('座標は「35.3606, 138.7274」のように半角数字とカンマで入力してください。');
      return;
    }

    localStorage.setItem('my_qso_callsign', rawCall);

    try {
      const res = await fetch(cleanDbUrl + '/stations/' + encodeCall(rawCall) + '.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          callsign: rawCall,
          place: place,
          lat: lat,
          lon: lon,
          updatedAt: Date.now()
        })
      });

      if (!res.ok) throw new Error("書き込み拒否（ルール設定を確認してください）");

      alert(rawCall + ' の運用場所（' + place + '）を登録しました！');
      loadAllData();
    } catch (e) {
      showError('登録エラー: ' + e.message);
    }
  });

  // ② 交信報告ボタン
  document.getElementById('btn-qso').addEventListener('click', async function() {
    const myCall = document.getElementById('reg-call').value.trim().toUpperCase();
    const targetCall = document.getElementById('log-target-call').value.trim().toUpperCase();
    const timeVal = document.getElementById('log-time').value;

    if (!myCall) {
      alert('先に左側の「① 自局コールサイン」を入力してください。');
      return;
    }
    if (!targetCall || !timeVal) {
      alert('相手局コールサインと交信時間を入力してください。');
      return;
    }
    if (myCall === targetCall) {
      alert('自局と相手局に同じコールサインは指定できません。');
      return;
    }

    localStorage.setItem('my_qso_callsign', myCall);

    try {
      const res = await fetch(cleanDbUrl + '/qso_logs.json', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          from: myCall,
          to: targetCall,
          time: timeVal.replace('T', ' '),
          createdAt: Date.now()
        })
      });

      if (!res.ok) throw new Error("送信拒否（ルール設定を確認してください）");

      document.getElementById('log-target-call').value = '';
      alert(myCall + ' → ' + targetCall + ' の交信を送信しました。');
      loadAllData();
    } catch (e) {
      showError('送信エラー: ' + e.message);
    }
  });

  document.getElementById('btn-refresh').addEventListener('click', loadAllData);

  function calcDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
