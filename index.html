<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リアルタイム無線交信（QSO）マッチングマップ</title>
<link rel="stylesheet" href="https://unpkg.com" />
<link rel="stylesheet" href="leaflet.css" />
<script src="https://unpkg.com"></script>
<script src="leaflet.js"></script>
<style>
  body { font-family: sans-serif; color: #333; max-width: 960px; margin: 0 auto; padding: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 15px; }
  .card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 15px; }
  .card h3 { margin: 0 0 10px 0; font-size: 16px; border-bottom: 2px solid #0284c7; padding-bottom: 5px; }
  .fg { margin-bottom: 10px; }
  .fg label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 3px; }
  .fg input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #94a3b8; border-radius: 4px; }
  .btn { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; color: #fff; cursor: pointer; }
  .btn-blue { background: #0284c7; }
  .btn-green { background: #16a34a; }
  .btn-gray { width: auto; padding: 5px 10px; background: #475569; font-size: 12px; }
  #map { height: 480px; width: 100%; border-radius: 8px; border: 1px solid #94a3b8; margin-bottom: 15px; background: #e2e8f0; }
  .bar { background: #e0f2fe; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; color: #0369a1; display: flex; justify-content: space-between; align-items: center; }
  .err { background: #fee2e2; color: #b91c1c; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }
  th { background: #f1f5f9; }
</style>
</head>
<body>

<div id="err-box" class="err"></div>

<div class="grid">
  <div class="card">
    <h3>① 自局の運用場所を登録（事前登録）</h3>
    <div class="fg"><label>自局コールサイン *</label><input type="text" id="reg-call" placeholder="例: JQ1XYZ/1"></div>
    <div class="fg"><label>運用場所名 *</label><input type="text" id="reg-place" placeholder="例: 富士山山頂"></div>
    <div class="fg"><label>運用場所の座標 (緯度, 経度) *</label><input type="text" id="reg-coord" placeholder="例: 35.3606, 138.7274"></div>
    <button type="button" class="btn btn-blue" onclick="handleReg()">自局の運用場所を登録・更新</button>
  </div>

  <div class="card">
    <h3>② 交信相手の入力（相互一致でライン描画）</h3>
    <div class="fg"><label>相手局コールサイン *</label><input type="text" id="log-target" placeholder="例: JJ1AAA/1"></div>
    <div class="fg"><label>交信時間 *</label><input type="datetime-local" id="log-time"></div>
    <p style="font-size: 12px; color: #64748b; margin: 0 0 10px 0;">※①の自局コールサインとして送信されます。</p>
    <button type="button" class="btn btn-green" onclick="handleQso()">交信ログを送信する</button>
  </div>
</div>

<div class="bar">
  <div>状態: <span id="sys-status">起動中...</span> ｜ 登録: <span id="st-cnt">0</span>局 ｜ 成立: <span id="mt-cnt">0</span>本</div>
  <button type="button" class="btn btn-gray" onclick="loadAllData()">最新に更新</button>
</div>

<div id="map"></div>

<h3>成立した交信一覧（双方入力済み）</h3>
<table>
  <thead>
    <tr><th>局A</th><th>局B</th><th>交信距離</th><th>交信時間</th></tr>
  </thead>
  <tbody id="tbody">
    <tr><td colspan="4" style="text-align:center;">双方の入力と運用場所登録が揃うとここに表示されます</td></tr>
  </tbody>
</table>

<script>
var GAS_URL = "https://google.com";
var map = null;
var layerGroup = null;

function showErr(msg) {
  var b = document.getElementById("err-box");
  b.style.display = "block";
  b.innerHTML = "⚠️ " + msg;
  document.getElementById("sys-status").textContent = "エラー";
}

function init() {
  if (typeof L !== "undefined") {
    map = L.map("map").setView([36.2048, 138.2529], 6);
    L.tileLayer("https://gsi.go.jp{z}/{x}/{y}.png").addTo(map);
    layerGroup = L.layerGroup().addTo(map);
  } else {
    showErr("地図ライブラリ(Leaflet)の読み込みに失敗しました。");
  }
  var now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById("log-time").value = now.toISOString().slice(0, 16);
  var saved = localStorage.getItem("my_call");
  if (saved) document.getElementById("reg-call").value = saved;
  loadAllData();
  setInterval(loadAllData, 10000);
}

function loadAllData() {
  fetch(GAS_URL + "?action=read", { redirect: "follow" })
    .then(function(r) {
      if (!r.ok) throw new Error("HTTPエラー: " + r.status);
      return r.text();
    })
    .then(function(txt) {
      var data = JSON.parse(txt);
      document.getElementById("sys-status").textContent = "接続完了";
      document.getElementById("err-box").style.display = "none";
      render(data.stations || [], data.logs || []);
    })
    .catch(function(e) {
      showErr("通信・データ解析エラー: " + e.message + "<br>※Apps Scriptの「デプロイを管理＞新バージョンでデプロイ」を行ったか確認してください。");
    });
}

function handleReg() {
  var call = document.getElementById("reg-call").value.trim().toUpperCase();
  var place = document.getElementById("reg-place").value.trim();
  var coord = document.getElementById("reg-coord").value.trim();
  if (!call || !place || !coord) {
    alert("コールサイン、運用場所、座標をすべて入力してください。");
    return;
  }
  var p = coord.split(",");
  var lat = parseFloat(p.shift());
  var lon = parseFloat(p.shift());
  if (isNaN(lat) || isNaN(lon)) {
    alert("座標は「35.3606, 138.7274」の形式で入力してください。");
    return;
  }
  localStorage.setItem("my_call", call);
  document.getElementById("sys-status").textContent = "登録中...";

  var query = "?action=reg&call=" + encodeURIComponent(call) +
              "&place=" + encodeURIComponent(place) +
              "&lat=" + encodeURIComponent(lat) +
              "&lon=" + encodeURIComponent(lon);

  fetch(GAS_URL + query, { redirect: "follow" })
    .then(function(r) { return r.text(); })
    .then(function() {
      alert(call + " を登録しました！");
      loadAllData();
    })
    .catch(function(e) {
      showErr("登録エラー: " + e.message);
    });
}

function handleQso() {
  var myCall = document.getElementById("reg-call").value.trim().toUpperCase();
  var tgCall = document.getElementById("log-target").value.trim().toUpperCase();
  var tm = document.getElementById("log-time").value;
  if (!myCall) {
    alert("先に①の自局コールサインを入力してください。");
    return;
  }
  if (!tgCall || !tm) {
    alert("相手局コールサインと交信時間を入力してください。");
    return;
  }
  if (myCall === tgCall) {
    alert("自局と相手局に同じコールサインは指定できません。");
    return;
  }
  localStorage.setItem("my_call", myCall);
  document.getElementById("sys-status").textContent = "送信中...";

  var query = "?action=qso&from=" + encodeURIComponent(myCall) +
              "&to=" + encodeURIComponent(tgCall) +
              "&time=" + encodeURIComponent(tm.replace("T", " "));

  fetch(GAS_URL + query, { redirect: "follow" })
    .then(function(r) { return r.text(); })
    .then(function() {
      document.getElementById("log-target").value = "";
      alert(myCall + " → " + tgCall + " を送信しました！");
      loadAllData();
    })
    .catch(function(e) {
      showErr("送信エラー: " + e.message);
    });
}

function calcDist(lat1, lon1, lat2, lon2) {
  var R = 6371;
  var rad = function(d) { return d * Math.PI / 180; };
  var dLat = rad(lat2 - lat1);
  var dLon = rad(lon2 - lon1);
  var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
}

function render(stationsList, logsList) {
  if (!layerGroup) return;
  layerGroup.clearLayers();
  var stMap = {};
  stationsList.forEach(function(st) {
    if (!st || !st.callsign) return;
    stMap[st.callsign] = st;
    L.marker([st.lat, st.lon]).bindPopup(st.callsign + " (" + st.place + ")").addTo(layerGroup);
  });
  document.getElementById("st-cnt").textContent = Object.keys(stMap).length;

  var pairs = new Map();
  logsList.forEach(function(a) {
    if (!a) return;
    var b = logsList.find(function(x) { return x && x.from === a.to && x.to === a.from; });
    if (b) {
      var k = [a.from, a.to].sort().join("__");
      if (!pairs.has(k)) pairs.set(k, { a: a, b: b });
    }
  });

  var tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  var cnt = 0;

  pairs.forEach(function(p) {
    var stA = stMap[p.a.from];
    var stB = stMap[p.b.from];
    if (stA && stB) {
      cnt++;
      var dist = calcDist(stA.lat, stA.lon, stB.lat, stB.lon);
      L.polyline([[stA.lat, stA.lon], [stB.lat, stB.lon]], { color: "#e11d48", weight: 4 }).addTo(layerGroup);
      var mLat = (stA.lat + stB.lat) / 2;
      var mLon = (stA.lon + stB.lon) / 2;
      L.tooltip({ permanent: true, direction: "center" }).setLatLng([mLat, mLon]).setContent(dist + " km").addTo(layerGroup);

      var tr = document.createElement("tr");
      tr.innerHTML = "<td>" + stA.callsign + " (" + stA.place + ")</td><td>" + stB.callsign + " (" + stB.place + ")</td><td><b>" + dist + " km</b></td><td>" + p.a.from + ": " + p.a.time + "<br>" + p.b.from + ": " + p.b.time + "</td>";
      tbody.appendChild(tr);
    }
  });

  document.getElementById("mt-cnt").textContent = cnt;
  if (cnt === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">双方の入力と運用場所登録が揃うとここに表示されます</td></tr>';
  }
}

window.addEventListener("load", init);
</script>
</body>
</html>
