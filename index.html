<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム無線交信（QSO）マッチングマップ</title>
  <link rel="stylesheet" href="https://unpkg.com" />
  <style>
    .qso-app {
      max-width: 960px;
      margin: 0 auto;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      color: #333;
    }
    .panel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    .card {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 15px;
    }
    .card h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #0f172a;
      border-bottom: 2px solid #0284c7;
      padding-bottom: 6px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #475569;
    }
    .form-group input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      font-size: 14px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
    }
    .btn-station { background: #0284c7; }
    .btn-station:hover { background: #0369a1; }
    .btn-qso { background: #16a34a; }
    .btn-qso:hover { background: #15803d; }
    #map {
      height: 500px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #94a3b8;
      margin-bottom: 20px;
    }
    .status-bar {
      background: #e0f2fe;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #0369a1;
    }
    .error-box {
      background: #fee2e2;
      color: #b91c1c;
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }
    table.match-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    table.match-table th, table.match-table td {
      border: 1px solid #cbd5e1;
      padding: 8px 10px;
      text-align: left;
    }
    table.match-table th {
      background: #f1f5f9;
    }
  </style>
</head>
<body>

<div class="qso-app">
  <div id="error-box" class="error-box"></div>

  <div class="panel-grid">
    <!-- 1. 自局の運用場所登録 -->
    <div class="card">
      <h3>① 自局の運用場所を登録（事前登録）</h3>
      <div class="form-group">
        <label>自局コールサイン *</label>
        <input type="text" id="reg-call" placeholder="例: JQ1XYZ/1">
      </div>
      <div class="form-group">
        <label>運用場所名 *</label>
        <input type="text" id="reg-place" placeholder="例: 富士山山頂">
      </div>
      <div class="form-group">
        <label>運用場所の座標 (緯度, 経度) *</label>
        <input type="text" id="reg-coord" placeholder="例: 35.3606, 138.7274">
      </div>
      <button type="button" id="btn-reg" class="btn btn-station">自局の運用場所を登録・更新</button>
    </div>

    <!-- 2. 交信相手の報告 -->
    <div class="card">
      <h3>② 交信相手の入力（相互一致でライン描画）</h3>
      <div class="form-group">
        <label>相手局コールサイン *</label>
        <input type="text" id="log-target-call" placeholder="例: JJ1AAA/1">
      </div>
      <div class="form-group">
        <label>交信時間 *</label>
        <input type="datetime-local" id="log-time">
      </div>
      <p style="font-size: 12px; color: #64748b; margin: 0 0 10px 0;">
        ※①で入力した自局コールサインとして送信されます。
      </p>
      <button type="button" id="btn-qso" class="btn btn-qso">交信ログを送信する</button>
    </div>
  </div>

  <div class="status-bar" id="status-bar">
    システム状態: <span id="sys-status">プログラム起動中...</span> ｜ 登録局数: <span id="stat-stations">0</span>局 ｜ 成立ライン数: <span id="stat-matches">0</span>本
  </div>

  <div id="map"></div>

  <h3>成立した交信一覧（双方入力済み）</h3>
  <table class="match-table">
    <thead>
      <tr>
        <th>局A（コール / 運用地）</th>
        <th>局B（コール / 運用地）</th>
        <th>交信距離</th>
        <th>交信時間（A報告 / B報告）</th>
      </tr>
    </thead>
    <tbody id="match-tbody">
      <tr><td colspan="4" style="text-align:center; color:#64748b;">双方の入力と運用場所登録が揃うとここに表示されます</td></tr>
    </tbody>
  </table>
</div>

<script src="https://unpkg.com"></script>
<script>
  window.onerror = function(msg, url, line) {
    const box = document.getElementById('error-box');
    box.style.display = 'block';
    box.innerHTML = '<b>⚠️ コード記述エラー（' + line + '行目）:</b><br>' + msg;
    document.getElementById('sys-status').textContent = 'コードエラー停止';
  };

  window.map = L.map('map').setView([36.2048, 138.2529], 6);
  L.tileLayer('https://gsi.go.jp{z}/{x}/{y}.png', {
    attribution: "<a href='https://gsi.go.jp' target='_blank'>地理院タイル</a>"
  }).addTo(window.map);
  window.layerGroup = L.layerGroup().addTo(window.map);

  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('log-time').value = now.toISOString().slice(0, 16);

  const savedCall = localStorage.getItem('my_qso_callsign');
  if (savedCall) {
    document.getElementById('reg-call').value = savedCall;
  }
  document.getElementById('sys-status').textContent = '地図表示完了（Firebase接続待ち）';
</script>

<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getDatabase, ref, set, push, onValue } from "https://gstatic.com";

  const showError = (msg) => {
    const box = document.getElementById('error-box');
    box.style.display = 'block';
    box.innerHTML = '<b>⚠️ Firebaseエラー:</b><br>' + msg;
    document.getElementById('sys-status').textContent = '接続エラー';
  };

  let db = null;
  try {
    if (firebaseConfig.apiKey.includes("★ここに")) {
      showError("Firebaseの設定値（★ここに〜）がまだ書き換えられていません。");
    } else if (firebaseConfig.databaseURL.includes("★ここに") || !firebaseConfig.databaseURL.startsWith("https://")) {
      showError("databaseURL が正しくありません。「https://〇〇.firebaseio.com」または「https://〇〇.firebasedatabase.app」のURLを入れてください。");
    } else {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      document.getElementById('sys-status').textContent = 'オンライン接続完了';
    }
  } catch (err) {
    showError("Firebase初期化エラー: " + err.message);
  }

  const encodeCall = (call) => call.trim().toUpperCase().replace(/\//g, '_');

  document.getElementById('btn-reg').addEventListener('click', async () => {
    if (!db) {
      alert('Firebaseが接続されていないため登録できません。画面上の赤いエラー内容を確認してください。');
      return;
    }

    const rawCall = document.getElementById('reg-call').value.trim().toUpperCase();
    const place = document.getElementById('reg-place').value.trim();
    const coordStr = document.getElementById('reg-coord').value.trim();

    if (!rawCall || !place || !coordStr) {
      alert('コールサイン、運用場所、座標をすべて入力してください。');
      return;
    }

    const parts = coordStr.split(',');
    const lat = parts.length >= 1 ? parseFloat(parts.shift().trim()) : NaN;
    const lon = parts.length >= 1 ? parseFloat(parts.shift().trim()) : NaN;

    if (isNaN(lat) || isNaN(lon)) {
      alert('座標は「35.3606, 138.7274」のように半角数字とカンマで入力してください。');
      return;
    }

    localStorage.setItem('my_qso_callsign', rawCall);

    try {
      await set(ref(db, 'stations/' + encodeCall(rawCall)), {
        callsign: rawCall,
        place: place,
        lat: lat,
        lon: lon,
        updatedAt: Date.now()
      });
      alert(`${rawCall} の運用場所（${place}）を登録しました！`);
    } catch (e) {
      showError('保存が拒否されました。Firebaseの「Realtime Database > ルール」が true になっているか確認してください。(' + e.message + ')');
    }
  });

  document.getElementById('btn-qso').addEventListener('click', async () => {
    if (!db) {
      alert('Firebaseが接続されていないため送信できません。');
      return;
    }

    const myCall = document.getElementById('reg-call').value.trim().toUpperCase();
    const targetCall = document.getElementById('log-target-call').value.trim().toUpperCase();
    const timeVal = document.getElementById('log-time').value;

    if (!myCall) {
      alert('先に左側の「① 自局コールサイン」を入力してください。');
      return;
    }
    if (!targetCall || !timeVal) {
      alert('相手局コールサインと交信時間を入力してください。');
      return;
    }
    if (myCall === targetCall) {
      alert('自局と相手局に同じコールサインは指定できません。');
      return;
    }

    localStorage.setItem('my_qso_callsign', myCall);

    try {
      await push(ref(db, 'qso_logs'), {
        from: myCall,
        to: targetCall,
        time: timeVal.replace('T', ' '),
        createdAt: Date.now()
      });
      document.getElementById('log-target-call').value = '';
      alert(`${myCall} → ${targetCall} の交信を送信しました。`);
    } catch (e) {
      showError('送信エラー: ' + e.message);
    }
  });

  function calcDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const toRad = deg => deg * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
  }
