<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無線交信（QSO）マッチングマップ</title>
<script src="leaflet.js"></script>
<style>
body{font-family:sans-serif;color:#333;max-width:960px;margin:0 auto;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px;margin-bottom:15px}
.card{background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:15px}
.card h3{margin:0 0 10px 0;font-size:16px;border-bottom:2px solid #0284c7;padding-bottom:5px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:12px;font-weight:bold;margin-bottom:3px}
.fg input{width:100%;padding:8px;box-sizing:border-box;border:1px solid #94a3b8;border-radius:4px}
.btn{width:100%;padding:10px;border:none;border-radius:4px;font-weight:bold;color:#fff;cursor:pointer}
.btn-blue{background:#0284c7}
.btn-green{background:#16a34a}
.btn-gray{width:auto;padding:5px 10px;background:#475569;font-size:12px}
#map{height:480px;width:100%;border-radius:8px;border:1px solid #94a3b8;margin-bottom:15px;background:#bae6fd;position:relative;overflow:hidden}
.bar{background:#e0f2fe;padding:10px;border-radius:6px;margin-bottom:15px;font-weight:bold;color:#0369a1;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.err{background:#fee2e2;color:#b91c1c;padding:10px;border-radius:6px;margin-bottom:15px;display:none;font-size:13px}
h3.sec-title{margin:20px 0 8px 0;font-size:16px;color:#0f172a}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:20px}
th,td{border:1px solid #cbd5e1;padding:8px;text-align:left}
th{background:#f1f5f9}
.wait-badge{display:inline-block;background:#fef3c7;color:#b45309;border:1px solid #f59e0b;padding:2px 6px;border-radius:4px;font-size:12px;font-weight:bold}
.leaflet-pane,.leaflet-tile,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-left{left:0}.leaflet-bottom{bottom:0}.leaflet-right{right:0}
.leaflet-control{pointer-events:auto;background:#fff;border:1px solid #ccc;margin:8px}
.leaflet-control-zoom a{display:block;width:26px;height:26px;line-height:26px;text-align:center;text-decoration:none;color:#000;font-weight:bold}
.leaflet-tooltip{position:absolute;padding:2px 6px;background:#fff;border:1px solid #e11d48;border-radius:4px;white-space:nowrap;font-size:12px;font-weight:bold;color:#be123c;pointer-events:none}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:15px}
.leaflet-popup-content-wrapper{padding:8px 12px;background:#fff;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
</style>
</head>
<body>
<div id="err-box" class="err"></div>
<div class="grid">
  <div class="card">
    <h3>① 自局の運用場所を登録（事前登録）</h3>
    <div class="fg"><label>自局コールサイン *</label><input type="text" id="reg-call" placeholder="例: チバKX56"></div>
    <div class="fg"><label>運用場所名 *</label><input type="text" id="reg-place" placeholder="例: 月山山頂"></div>
    <div class="fg"><label>運用場所の座標 (緯度, 経度) *</label><input type="text" id="reg-coord" placeholder="例: 38.5497, 140.0269"></div>
    <button type="button" class="btn btn-blue" onclick="handleReg()">自局の運用場所を登録・更新</button>
  </div>
  <div class="card">
    <h3>② 交信相手の入力（相互一致でライン描画）</h3>
    <div class="fg"><label>相手局コールサイン *</label><input type="text" id="log-target" placeholder="例: サイタマKM117"></div>
    <div class="fg"><label>交信時間 *</label><input type="datetime-local" id="log-time"></div>
    <p style="font-size:12px;color:#64748b;margin:0 0 10px 0">※①の自局コールサインとして送信されます。</p>
    <button type="button" class="btn btn-green" onclick="handleQso()">交信ログを送信する</button>
  </div>
</div>

<div class="bar">
  <div>状態: <span id="sys-status">起動中...</span> ｜ 登録: <span id="st-cnt">0</span>局 ｜ 成立: <span id="mt-cnt">0</span>本 ｜ 入力待ち: <span id="wt-cnt">0</span>件</div>
  <button type="button" class="btn btn-gray" onclick="loadAllData()">最新に更新</button>
</div>

<div id="map"></div>

<h3 class="sec-title">✅ 成立した交信一覧（双方入力済み）</h3>
<table>
  <thead><tr><th>局A</th><th>局B</th><th>交信距離</th><th>交信時間</th></tr></thead>
  <tbody id="tbody"><tr><td colspan="4" style="text-align:center">双方の入力と運用場所登録が揃うとここに表示されます</td></tr></tbody>
</table>

<h3 class="sec-title">⏳ 相手局の入力待ち一覧（片道ログ）</h3>
<table>
  <thead><tr><th>送信局（報告者）</th><th>交信相手（入力待ち）</th><th>報告された交信時間</th><th>ステータス</th></tr></thead>
  <tbody id="wait-tbody"><tr><td colspan="4" style="text-align:center">入力待ちのログはありません</td></tr></tbody>
</table>

<script>
var GAS_URL="https://script.google.com/macros/s/AKfycbzekdUKLnK-3kNEC6eR-NvaLruIwMiZLJVjCyRmv0-77FCLZIkY0SRCL2Zif8VIfoEOZA/exec";
var map=null,layerGroup=null;
function showErr(m){var b=document.getElementById("err-box");b.style.display="block";b.innerHTML="⚠️ "+m;document.getElementById("sys-status").textContent="エラー";}
function init(){
  if(typeof L!=="undefined"){
    map=L.map("map").setView([36.8,139.5],6);
    fetch("japan.geojson").then(function(r){return r.json();}).then(function(geo){
      L.geoJSON(geo,{
        style:{color:"#65a30d",weight:1,fillColor:"#ecfccb",fillOpacity:1},
        onEachFeature:function(f,ly){
          var nm=(f.properties&&(f.properties.nam_ja||f.properties.name))||"";
          if(nm)ly.bindTooltip(nm,{sticky:true});
        }
      }).addTo(map).bringToBack();
    });
    layerGroup=L.layerGroup().addTo(map);
    setTimeout(function(){map.invalidateSize();},400);
  }
  var now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
  document.getElementById("log-time").value=now.toISOString().slice(0,16);
  var s=localStorage.getItem("my_call");if(s)document.getElementById("reg-call").value=s;
  loadAllData();setInterval(loadAllData,10000);
}
function callGas(p,cb){
  var n="cb_"+Date.now()+"_"+Math.floor(Math.random()*9999);
  var sc=document.createElement("script");
  var tm=setTimeout(function(){delete window[n];if(sc.parentNode)sc.parentNode.removeChild(sc);showErr("応答タイムアウト");},15000);
  window[n]=function(d){clearTimeout(tm);delete window[n];if(sc.parentNode)sc.parentNode.removeChild(sc);cb(d);};
  sc.onerror=function(){clearTimeout(tm);delete window[n];if(sc.parentNode)sc.parentNode.removeChild(sc);showErr("通信エラー");};
  sc.src=GAS_URL+"?"+p+"&callback="+n;document.body.appendChild(sc);
}
function loadAllData(){
  callGas("action=read",function(d){
    document.getElementById("sys-status").textContent="接続完了";
    document.getElementById("err-box").style.display="none";
    render(d.stations||[],d.logs||[]);
  });
}
function handleReg(){
  var c=document.getElementById("reg-call").value.trim().toUpperCase();
  var pl=document.getElementById("reg-place").value.trim();
  var co=document.getElementById("reg-coord").value.trim();
  if(!c||!pl||!co){alert("すべて入力してください");return;}
  var p=co.split(","),lat=parseFloat(p.shift()),lon=parseFloat(p.shift());
  if(isNaN(lat)||isNaN(lon)){alert("座標は「38.5497, 140.0269」の形式で入力してください");return;}
  localStorage.setItem("my_call",c);document.getElementById("sys-status").textContent="登録中...";
  var q="action=reg&call="+encodeURIComponent(c)+"&place="+encodeURIComponent(pl)+"&lat="+encodeURIComponent(lat)+"&lon="+encodeURIComponent(lon);
  callGas(q,function(){alert(c+" を登録しました！");loadAllData();});
}
function handleQso(){
  var mc=document.getElementById("reg-call").value.trim().toUpperCase();
  var tc=document.getElementById("log-target").value.trim().toUpperCase();
  var tm=document.getElementById("log-time").value;
  if(!mc||!tc||!tm){alert("必須項目を入力してください");return;}
  if(mc===tc){alert("同じコールサインは指定できません");return;}
  localStorage.setItem("my_call",mc);document.getElementById("sys-status").textContent="送信中...";
  var q="action=qso&from="+encodeURIComponent(mc)+"&to="+encodeURIComponent(tc)+"&time="+encodeURIComponent(tm.replace("T"," "));
  callGas(q,function(){document.getElementById("log-target").value="";alert(mc+" → "+tc+" を送信しました！");loadAllData();});
}
function calcDist(a,b,c,d){
  var R=6371,r=function(v){return v*Math.PI/180;};
  var dLat=r(c-a),dLon=r(d-b);
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return (R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))).toFixed(1);
}
function render(stList,lgList){
  if(!layerGroup)return;
  layerGroup.clearLayers();
  var sm={};
  stList.forEach(function(s){
    if(!s||!s.callsign)return;sm[s.callsign]=s;
    L.circleMarker([s.lat,s.lon],{radius:8,fillColor:"#0284c7",color:"#fff",weight:2,fillOpacity:0.9}).bindPopup("<b>"+s.callsign+"</b><br>"+s.place).addTo(layerGroup);
  });
  document.getElementById("st-cnt").textContent=Object.keys(sm).length;

  var pairs=new Map();
  var oneWayList=[];
  var seenOneWay=new Set();

  lgList.forEach(function(a){
    if(!a||!a.from||!a.to)return;
    var b=lgList.find(function(x){return x&&x.from===a.to&&x.to===a.from;});
    if(b){
      var k=[a.from,a.to].sort().join("__");
      if(!pairs.has(k))pairs.set(k,{a:a,b:b});
    }else{
      var owKey=a.from+"__"+a.to;
      if(!seenOneWay.has(owKey)){
        seenOneWay.add(owKey);
        oneWayList.push(a);
      }
    }
  });

  // 1. 成立済みテーブル＆地図ライン描画
  var tb=document.getElementById("tbody");tb.innerHTML="";var cnt=0;
  pairs.forEach(function(p){
    var sA=sm[p.a.from],sB=sm[p.b.from];
    if(sA&&sB){
      cnt++;var dist=calcDist(sA.lat,sA.lon,sB.lat,sB.lon);
      L.polyline([[sA.lat,sA.lon],[sB.lat,sB.lon]],{color:"#e11d48",weight:4}).addTo(layerGroup);
      L.tooltip({permanent:true,direction:"center"}).setLatLng([(sA.lat+sB.lat)/2,(sA.lon+sB.lon)/2]).setContent(dist+" km").addTo(layerGroup);
      var tr=document.createElement("tr");
tr.innerHTML=""+sA.callsign+" ("+sA.place+")"+sB.callsign+" ("+sB.place+")"+dist+" km"+p.a.from+": "+p.a.time+"
"+p.b.from+": "+p.b.time+"";
tb.appendChild(tr);
}
});
document.getElementById("mt-cnt").textContent=cnt;
if(cnt===0)tb.innerHTML='双方の入力と運用場所登録が揃うとここに表示されます';
// 2. 片道ログ（相手局の入力待ち）テーブル描画
var wtb=document.getElementById("wait-tbody");wtb.innerHTML="";
document.getElementById("wt-cnt").textContent=oneWayList.length;
if(oneWayList.length===0){
wtb.innerHTML='現在、相手局の入力待ちログはありません';
}else{
oneWayList.forEach(function(w){
var fromPlace=sm[w.from]?" ("+sm[w.from].place+")":"";
var toPlace=sm[w.to]?" ("+sm[w.to].place+")":" (運用地未登録)";
var tr=document.createElement("tr");
tr.innerHTML=""+w.from+""+fromPlace+""+w.to+""+toPlace+""+w.time+"⏳ "+w.to+" の入力待ち";
wtb.appendChild(tr);
});
}
}
init();
