<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無線交信（QSO）マッチングマップ</title>
<script src="leaflet.js"></script>
<style>
body{font-family:sans-serif;color:#333;max-width:960px;margin:0 auto;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px;margin-bottom:15px}
.card{background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:15px}
.card h3{margin:0 0 10px;font-size:16px;border-bottom:2px solid #0284c7;padding-bottom:5px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:12px;font-weight:bold;margin-bottom:3px}
.fg input{width:100%;padding:8px;box-sizing:border-box;border:1px solid #94a3b8;border-radius:4px}
.btn{width:100%;padding:10px;border:none;border-radius:4px;font-weight:bold;color:#fff;cursor:pointer}
.btn-blue{background:#0284c7}.btn-green{background:#16a34a}
.btn-gray{width:auto;padding:5px 10px;background:#475569;font-size:12px}
#map{height:460px;width:100%;border-radius:8px;border:1px solid #94a3b8;margin-bottom:15px;background:#bae6fd;position:relative;overflow:hidden}
.bar{background:#e0f2fe;padding:10px;border-radius:6px;margin-bottom:15px;font-weight:bold;color:#0369a1;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.err{background:#fee2e2;color:#b91c1c;padding:10px;border-radius:6px;margin-bottom:15px;display:none;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:20px}
th,td{border:1px solid #cbd5e1;padding:8px;text-align:left}
th{background:#f1f5f9}
.wb{background:#fef3c7;color:#b45309;border:1px solid #f59e0b;padding:2px 6px;border-radius:4px;font-size:12px;font-weight:bold}
.leaflet-pane,.leaflet-tile,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-left{left:0}.leaflet-bottom{bottom:0}.leaflet-right{right:0}
.leaflet-control{pointer-events:auto;background:#fff;border:1px solid #ccc;margin:8px}
.leaflet-control-zoom a{display:block;width:26px;height:26px;line-height:26px;text-align:center;text-decoration:none;color:#000;font-weight:bold}
.leaflet-tooltip{position:absolute;padding:2px 6px;background:#fff;border:1px solid #e11d48;border-radius:4px;white-space:nowrap;font-size:12px;font-weight:bold;color:#be123c;pointer-events:none}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:15px}
.leaflet-popup-content-wrapper{padding:8px 12px;background:#fff;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
</style>
</head>
<body>
<div id="err" class="err"></div>
<div class="grid">
  <div class="card">
    <h3>① 自局の運用場所を登録</h3>
    <div class="fg"><label>自局コールサイン *</label><input id="rc" placeholder="例: チバKX56"></div>
    <div class="fg"><label>運用場所名 *</label><input id="rp" placeholder="例: 月山山頂"></div>
    <div class="fg"><label>座標 (緯度, 経度) *</label><input id="rx" placeholder="例: 38.5497, 140.0269"></div>
    <button class="btn btn-blue" onclick="reg()">運用場所を登録・更新</button>
  </div>
  <div class="card">
    <h3>② 交信相手の入力</h3>
    <div class="fg"><label>相手局コールサイン *</label><input id="lt" placeholder="例: サイタマKM117"></div>
    <div class="fg"><label>交信時間 *</label><input type="datetime-local" id="tm"></div>
    <p style="font-size:12px;color:#64748b;margin:0 0 10px">※①の自局コールサインで送信されます</p>
    <button class="btn btn-green" onclick="qso()">交信ログを送信</button>
  </div>
</div>
<div class="bar">
  <div>状態:<span id="st">起動中</span>｜登録:<span id="c1">0</span>局｜成立:<span id="c2">0</span>本｜入力待ち:<span id="c3">0</span>件</div>
  <button class="btn btn-gray" onclick="load()">更新</button>
</div>
<div id="map"></div>
<h3>✅ 成立した交信一覧</h3>
<table><thead><tr><th>局A</th><th>局B</th><th>距離</th><th>時間</th></tr></thead><tbody id="tb1"></tbody></table>
<h3>⏳ 相手局の入力待ち一覧（片道ログ）</h3>
<table><thead><tr><th>送信局</th><th>相手局（入力待ち）</th><th>報告時間</th><th>状態</th></tr></thead><tbody id="tb2"></tbody></table>
<script>
var U="https://script.google.com/macros/s/AKfycbzekdUKLnK-3kNEC6eR-NvaLruIwMiZLJVjCyRmv0-77FCLZIkY0SRCL2Zif8VIfoEOZA/exec",m,lg;
function err(s){var b=document.getElementById("err");b.style.display="block";b.innerHTML="⚠️ "+s;document.getElementById("st").textContent="エラー";}
function gas(p,cb){
  var n="c_"+Date.now()+"_"+Math.floor(Math.random()*999),s=document.createElement("script");
  var t=setTimeout(function(){delete window[n];s.remove();err("タイムアウト");},15000);
  window[n]=function(d){clearTimeout(t);delete window[n];s.remove();cb(d);};
  s.onerror=function(){clearTimeout(t);delete window[n];s.remove();err("通信エラー");};
  s.src=U+"?"+p+"&callback="+n;document.body.appendChild(s);
}
function load(){gas("action=read",function(d){document.getElementById("st").textContent="接続完了";document.getElementById("err").style.display="none";draw(d.stations||[],d.logs||[]);});}
function reg(){
  var c=document.getElementById("rc").value.trim().toUpperCase(),p=document.getElementById("rp").value.trim(),x=document.getElementById("rx").value.split(",");
  var la=parseFloat(x[0]),lo=parseFloat(x[1]);
  if(!c||!p||isNaN(la)||isNaN(lo))return alert("正しく入力してください");
  localStorage.setItem("mc",c);document.getElementById("st").textContent="登録中...";
  gas("action=reg&call="+encodeURIComponent(c)+"&place="+encodeURIComponent(p)+"&lat="+la+"&lon="+lo,function(){alert("登録完了");load();});
}
function qso(){
  var mc=document.getElementById("rc").value.trim().toUpperCase(),tc=document.getElementById("lt").value.trim().toUpperCase(),tm=document.getElementById("tm").value.replace("T"," ");
  if(!mc||!tc||!tm||mc===tc)return alert("入力内容を確認してください");
  localStorage.setItem("mc",mc);document.getElementById("st").textContent="送信中...";
  gas("action=qso&from="+encodeURIComponent(mc)+"&to="+encodeURIComponent(tc)+"&time="+encodeURIComponent(tm),function(){document.getElementById("lt").value="";alert("送信完了");load();});
}
function dst(a,b,c,d){
  var r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;
  return(12742*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))).toFixed(1);
}
function draw(sl,ll){
  if(!lg)return;lg.clearLayers();var sm={};
  sl.forEach(function(s){if(s&&s.callsign){sm[s.callsign]=s;L.circleMarker([s.lat,s.lon],{radius:8,fillColor:"#0284c7",color:"#fff",weight:2,fillOpacity:0.9}).bindPopup("<b>"+s.callsign+"</b><br>"+s.place).addTo(lg);}});
  document.getElementById("c1").textContent=Object.keys(sm).length;
  var ps=new Map(),ow=[],sw=new Set();
  ll.forEach(function(a){
    if(!a||!a.from||!a.to)return;
    var b=ll.find(function(x){return x&&x.from===a.to&&x.to===a.from;});
    if(b){var k=[a.from,a.to].sort().join("_");if(!ps.has(k))ps.set(k,{a:a,b:b});}
    else if(!sw.has(a.from+"_"+a.to)){sw.add(a.from+"_"+a.to);ow.push(a);}
  });
  var t1=document.getElementById("tb1");t1.innerHTML="";var cnt=0;
  ps.forEach(function(p){
    var A=sm[p.a.from],B=sm[p.b.from];
    if(A&&B){
      cnt++;var d=dst(A.lat,A.lon,B.lat,B.lon);
      L.polyline([[A.lat,A.lon],[B.lat,B.lon]],{color:"#e11d48",weight:4}).addTo(lg);
      L.tooltip({permanent:true,direction:"center"}).setLatLng([(A.lat+B.lat)/2,(A.lon+B.lon)/2]).setContent(d+" km").addTo(lg);
      t1.innerHTML+="<tr><td>"+A.callsign+"("+A.place+")</td><td>"+B.callsign+"("+B.place+")</td><td><b>"+d+" km</b></td><td>"+p.a.from+":"+p.a.time+"<br>"+p.b.from+":"+p.b.time+"</td></tr>";
    }
  });
  document.getElementById("c2").textContent=cnt;
  if(!cnt)t1.innerHTML='<tr><td colspan="4" style="text-align:center">一致ログなし</td></tr>';
  var t2=document.getElementById("tb2");t2.innerHTML="";document.getElementById("c3").textContent=ow.length;
  if(!ow.length)t2.innerHTML='<tr><td colspan="4" style="text-align:center">入力待ちなし</td></tr>';
  else ow.forEach(function(w){
    var p1=sm[w.from]?"("+sm[w.from].place+")":"",p2=sm[w.to]?"("+sm[w.to].place+")":"<small>(運用地未登録)</small>";
    t2.innerHTML+="<tr><td><b>"+w.from+"</b>"+p1+"</td><td><b>"+w.to+"</b>"+p2+"</td><td>"+w.time+"</td><td><span class='wb'>⏳ "+w.to+" 待ち</span></td></tr>";
  });
}
if(typeof L!=="undefined"){
  m=L.map("map").setView([36.8,139.5],6);
  fetch("japan.geojson").then(function(r){return r.json();}).then(function(g){
    L.geoJSON(g,{style:{color:"#65a30d",weight:1,fillColor:"#ecfccb",fillOpacity:1},onEachFeature:function(f,l){var n=(f.properties&&(f.properties.nam_ja||f.properties.name))||"";if(n)l.bindTooltip(n,{sticky:true});}}).addTo(m).bringToBack();
  });
  lg=L.layerGroup().addTo(m);setTimeout(function(){m.invalidateSize();},400);
}
var nw=new Date();nw.setMinutes(nw.getMinutes()-nw.getTimezoneOffset());
document.getElementById("tm").value=nw.toISOString().slice(0,16);
var sv=localStorage.getItem("mc");if(sv)document.getElementById("rc").value=sv;
load();setInterval(load,10000);
</script>
</body>
</html>
